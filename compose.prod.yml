name: pen-migration

services:
  converter:
    image: golusingh07/pen-wordpress-migrator-converter:latest
    build:
      context: .
      dockerfile: docker/converter.Dockerfile
      target: prod
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: production
      CONVERTER_PORT: "5174"
      PROJECTS_ROOT: /app/output
      TMP_DIR: /app/tmp
      WP_URL: ${WP_URL:-http://host.docker.internal:8084}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://host.docker.internal:8084}
    volumes:
      - ./output:/app/output
      - ./tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5174/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin:
    image: golusingh07/pen-wordpress-migrator-admin:latest
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: prod
    ports:
      - "5173:5173"
      # Project editors started inside Admin (Vite on 8000–8080)
      - "8000-8080:8000-8080"
    environment:
      NODE_ENV: production
      STUDIO_PORT: "5173"
      CONVERTER_URL: http://converter:5174
      PROJECTS_ROOT: /app/output
      TMP_DIR: /app/tmp
      # Browser-facing origin for editor links (no port — port is appended per project)
      EDITOR_PUBLIC_ORIGIN: ${EDITOR_PUBLIC_ORIGIN:-http://localhost}
      WP_URL: ${WP_URL:-http://host.docker.internal:8084}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://host.docker.internal:8084}
    volumes:
      - ./output:/app/output
      - ./tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      converter:
        condition: service_healthy
