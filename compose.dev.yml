name: pen-migration

services:
  converter:
    image: pen-converter:dev
    build:
      context: .
      dockerfile: docker/converter.Dockerfile
      target: dev
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: development
      CONVERTER_PORT: "5174"
      PROJECTS_ROOT: /app/output
      TMP_DIR: /app/tmp
      WP_URL: ${WP_URL:-http://host.docker.internal:8084}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://host.docker.internal:8084}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./Converter:/app/Converter
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5174/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  admin:
    image: pen-admin:dev
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      STUDIO_PORT: "4000"
      CONVERTER_URL: http://converter:5174
      PROJECTS_ROOT: /app/output
      TMP_DIR: /app/tmp
      WP_URL: ${WP_URL:-http://host.docker.internal:8084}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://host.docker.internal:8084}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./Admin:/app/Admin
      - ./Converter:/app/Converter
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      converter:
        condition: service_healthy
